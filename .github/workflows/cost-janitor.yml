name: Cost Janitor

on:
  pull_request:

jobs:
  janitor:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve

      - name: Install Python Dependencies
        run: |
          cd janitor
          pip install -r requirements.txt

      - name: Run Cost Janitor
        run: |
          cd janitor
          python3 janitor.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: janitor-reports
          path: |
            janitor/report.json
            janitor/summary.md
